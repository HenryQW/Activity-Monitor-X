name: Release

# A tag v<VERSION> (the VERSION file) builds Activity Monitor X, signed with the self-signed release identity (no
# Developer ID, D91), and publishes AMX-<VERSION>.dmg and AMX.dmg (the "latest" link on the docs site) on a GitHub
# release. With TAP_TOKEN set, the cask in HenryQW/homebrew-tap moves to this version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the release notes need the previous tag and the commits since it

      - name: Check that the tag is the version
        run: |
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      # Xcode has the Swift Testing plugin, so the plain command works here (`make test` is for Command Line Tools).
      - name: Test
        run: swift test

      - name: Import the release signing identity
        env:
          RELEASE_CERT_P12: ${{ secrets.RELEASE_CERT_P12 }}
          RELEASE_CERT_PASSWORD: ${{ secrets.RELEASE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          printf '%s' "$RELEASE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/release.p12" -k "$KEYCHAIN" -P "$RELEASE_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/release.p12"
          # codesign may use the key without a prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # In the search list, so codesign finds the identity by its name.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build the app and the disk image
        run: make dmg IDENTITY="Activity Monitor X Release Signing"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ".build/AMX-$VERSION.dmg" .build/AMX.dmg
          # In .build/, so the checksum file names the bare file name and `shasum -c` works next to the download.
          (cd .build && shasum -a 256 "AMX-$VERSION.dmg" | tee "AMX-$VERSION.dmg.sha256")
          # Notes: the subject of each commit since the previous tag; the first release has no previous tag.
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            git log --no-merges --format='- %s' "$PREV..HEAD" > .build/notes.md
            printf '\nAll changes: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$PREV" "$GITHUB_REF_NAME" >> .build/notes.md
          else
            echo "First release." > .build/notes.md
          fi
          # A re-run (the tap step failed) replaces the files of the release it made.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ".build/AMX-$VERSION.dmg" ".build/AMX-$VERSION.dmg.sha256" .build/AMX.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" ".build/AMX-$VERSION.dmg" ".build/AMX-$VERSION.dmg.sha256" .build/AMX.dmg \
              --title "Activity Monitor X $VERSION" --notes-file .build/notes.md
          fi

      - name: Update the Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          SHA256="$(shasum -a 256 ".build/AMX-$VERSION.dmg" | cut -d ' ' -f 1)"
          git clone "https://x-access-token:$TAP_TOKEN@github.com/HenryQW/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA256/" Packaging/homebrew/amx.rb > "$RUNNER_TEMP/tap/Casks/amx.rb"
          cd "$RUNNER_TEMP/tap"
          git add Casks/amx.rb
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "amx $VERSION"
          git push

      - name: Delete the temporary keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN"
